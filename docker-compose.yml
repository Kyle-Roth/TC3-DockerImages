# Reads TC_IMAGE, AMS_NETID and BHF_USER/BHF_PASSWORD (optional, for apt inside the container) from .env
services:
  tc31-xar:
    image: ${TC_IMAGE:-tc31-xar:basic}
    environment:
      AMS_NETID: 192.168.1.69.1.1
      BHF_USER: $BHF_USER
      BHF_PASSWORD: $BHF_PASSWORD
    volumes:
      - /dev/hugepages:/dev/hugepages:rw
    # Realtime scheduling, EFI variables and host NICs (EtherCAT).
    # Dev/test hosts only need realtime: replace with  cap_add: [SYS_NICE]
    privileged: true
    ports:
      - "8016:8016/tcp"
      - "48898:48898/tcp"
      - "48899:48899/udp"
    restart: unless-stopped

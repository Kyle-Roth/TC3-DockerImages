name: Build TwinCAT images

on:
  push:
    branches: [master]
    paths: ['.forgejo/workflows/**', 'docker/**', 'profiles/**', 'scripts/**']
  pull_request:
    paths: ['.forgejo/workflows/**', 'docker/**', 'profiles/**', 'scripts/**']
  schedule:
    - cron: '0 12 * * 1'   # weekly, picks up new Beckhoff/Debian packages
  workflow_dispatch:

jobs:
  profiles:
    runs-on: catthehacker-latest-armbox
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(scripts/list-profiles.sh --json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.profile }}
    needs: profiles
    runs-on: catthehacker-latest-armbox
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.list) }}
    env:
      PROFILE: ${{ matrix.profile }}
      # schedule/manual -> release tags; push to master -> dev tags; PRs never push
      CHANNEL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || 'dev' }}
      BHF_USER: ${{ vars.BHF_USER }}
      BHF_PASSWORD: ${{ secrets.BHF_PASSWORD }}
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ vars.GHCR_OWNER }}
      IMAGE_SOURCE: ${{ vars.IMAGE_SOURCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/docker/setup-qemu-action@v3
        with:
          cache-image: false   # the runner's Actions cache is unreachable; the image is local anyway
      - uses: https://github.com/docker/setup-buildx-action@v3

      - name: Build
        run: scripts/build.sh "$PROFILE"

      - name: Verify no credentials in image
        run: scripts/verify-no-secrets.sh "$(scripts/build.sh "$PROFILE" --print-tags | head -n1)"

      - name: Smoke test
        run: |
          docker run --rm "$(scripts/build.sh "$PROFILE" --print-tags | head -n1)" \
            sh -c 'test -x /usr/bin/TcSystemServiceUm && command -v adstool && echo "profile=$TC_profile"'

      - name: Push
        if: github.event_name != 'pull_request'   # PRs only build and verify
        env:
          GHCR_USER: ${{ vars.GHCR_USER || vars.GHCR_OWNER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          : "${IMAGE_OWNER:?set the GHCR_OWNER repository variable}" "${GHCR_TOKEN:?set the GHCR_TOKEN secret}"
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          scripts/build.sh "$PROFILE" --push
